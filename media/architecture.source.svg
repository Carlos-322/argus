<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="626.389" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
<title id="title">Multimodal annotation pipeline</title>
<desc id="description">Supported formats yield episode RGB, state and actions, depth, tactile, other fields and task context. Field interpretation and recording checks preserve native units and clocks. Run settings determine timestamped frame grids, task context, checks and request boundaries. The selected VLM annotates each request. Optional model-guided evidence selection reads additional episode data before the final annotation call and may repeat. Request chunks rejoin on the original timeline, preserving gaps, then feed the video viewer and JSON exports. Verification, receipts, spending caps and verified resume apply across the run.</desc>
