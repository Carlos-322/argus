<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1204" viewBox="0 0 1480 1204" role="img" aria-labelledby="title description">
<title id="title">Shared evidence and annotation architecture</title>
<desc id="description">Format readers produce one source-owned episode containing camera, state, depth, tactile, other native fields and publisher context. The field dictionary and data checks add meanings and findings to this evidence. Shared recording-setup and model policy controls the annotation harness. Its request builder composes conditional prompts and sampled views, with optional task-text image-detail routing. For eligible extra fields, an optional same-model evidence selector requests bounded source reads and measurements before the final annotation. Parts rejoin on source timestamps for video overlays and JSON downloads. Source identities, saved requests, spending reservations and verified resume apply across the run.</desc>
