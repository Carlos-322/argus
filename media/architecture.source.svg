.body {font-size:24px}
.caption {font-size:23px;fill:#625d54}
.edge {fill:none;stroke:#716d64;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.optional {stroke-dasharray:5 5}
.packet {fill:#245d7b}
@media (prefers-reduced-motion:reduce) {.packet {display:none}}
</style><rect width="1440" height="720" fill="#fff" rx="8"/><g clip-path="url(#canvas)">
